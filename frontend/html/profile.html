<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
            connect-src 'self' http://127.0.0.1:3000 https://cdn.jsdelivr.net;
            script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; 
            style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
            font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/profile.css" />

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="../javascript/profile.js" defer></script>
</head>

<body>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i data-lucide="crown"></i>
            <span>MattMester</span>
        </div>
        <div class="nav flex-column">
            <a href="#dashboard" class="nav-link active">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="#profile" class="nav-link">
                <i data-lucide="user"></i>
                Profile
            </a>
            <a href="#games" class="nav-link">
                <i data-lucide="gamepad-2"></i>
                Game History
            </a>
            <a href="#statistics" class="nav-link">
                <i data-lucide="bar-chart-3"></i>
                Statistics
            </a>
            <a href="#friends" class="nav-link">
                <i data-lucide="users"></i>
                Friends
            </a>
            <a href="#abilities" class="nav-link">
                <i data-lucide="zap"></i>
                Abilities
            </a>
            <a href="#security" class="nav-link">
                <i data-lucide="shield"></i>
                Security
            </a>
            <a href="#settings" class="nav-link">
                <i data-lucide="settings"></i>
                Settings
            </a>
        </div>
        <div class="mt-auto p-4 border-top border-secondary" style="border-color: var(--border-color) !important;">
            <button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2"
                type="button" data-bs-toggle="modal" data-bs-target="#logoutModal">
                <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
                Logout
            </button>
        </div>
    </nav>

    <main class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-gold d-lg-none py-1 px-2" onclick="toggleSidebar()">
                    <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
                </button>
                <div class="top-bar-search d-none d-md-block">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search games, players...">
                </div>
            </div>

            <div class="top-bar-actions">
                <!-- talán fényes sötét mód?-->
                <!-- <div class="theme-toggle" data-tooltip="Toggle Theme">
                    <div class="theme-toggle-knob">
                        <i data-lucide="moon" style="width: 12px; height: 12px; color: var(--bg-sidebar);"></i>
                    </div>
                </div> -->
                <button class="top-bar-btn" type="button" data-tooltip="Notifications" data-bs-toggle="modal"
                    data-bs-target="#notificationsModal">
                    <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
                    <span class="notification-dot"></span>
                </button>
                <div class="top-bar-user">
                    <div class="top-bar-user-info">
                        <div class="top-bar-user-name">GrandMaster_99</div>
                        <div class="top-bar-user-role">Admin</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content dashboard -->
        <div class="main-content-inner" id="dashboard">
            <div class="profile-header animate-in animate-in-1 section-block" id="profile">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="d-flex flex-wrap align-items-center gap-4">
                            <div class="position-relative">
                                <img src="https://ui-avatars.com/api/?name=GrandMaster_99&background=1e293b&color=d4af37&size=240"
                                    alt="Profile" class="profile-avatar" id="profileAvatarMain">
                                <span class="position-absolute bottom-0 end-0 p-1">
                                    <span class="status-dot"></span>
                                </span>
                            </div>
                            <div>
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <h1 class="h3 mb-0 text-white">GrandMaster_99</h1>
                                    <span class="role-badge admin">Admin</span>
                                </div>
                                <p class="text-secondary mb-2">admin@mattmester.com</p>
                                <div class="profile-status">
                                    <span class="status-dot"></span>
                                    Online
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5 mt-4 mt-md-0">
                        <div class="d-flex justify-content-md-end flex-wrap gap-3">
                            <div class="elo-display text-center">
                                <div class="elo-number">1,500</div>
                                <div class="elo-label">Klasszikus</div>
                                <div class="elo-rank rank-master">Master</div>
                            </div>
                            <div class="elo-display text-center">
                                <div class="elo-number">1,650</div>
                                <div class="elo-label">MattMester</div>
                                <div class="elo-rank rank-master">Master</div>
                            </div>
                            <div class="elo-display text-center">
                                <div class="elo-number">1,420</div>
                                <div class="elo-label">Bullet</div>
                                <div class="elo-rank rank-master">Master</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            
        </div>
    </main>
</body>

</html>
