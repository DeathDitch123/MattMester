<!DOCTYPE html>
<html lang="hu">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Game Room</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="/socket.io/socket.io.js" defer></script>
	<script src="../javascript/socketClient.js" defer></script>
	<script src="../javascript/chatModal.js" defer></script>
	<script src="../javascript/gameRoom.js" defer></script>
</head>
<body class="bg-dark text-light">
	<main class="container py-4 py-md-5">
		<section class="row justify-content-center">
			<div class="col-12 col-lg-8">
				<div class="card bg-black border-secondary shadow-sm">
					<div class="card-body p-4">
						<h1 class="h4 mb-3">Game Room</h1>
						<p class="text-secondary mb-4">A játékoldalon is ugyanaz a közös chat modal nyílik meg.</p>
						<div class="d-flex flex-wrap gap-2">
							<button id="gameRoomOpenChat" type="button" class="btn btn-warning" data-open-chat="inbox">
								Chat megnyitása
							</button>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>
</body>
</html>
