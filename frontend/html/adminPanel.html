<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' http://127.0.0.1:3000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/adminPanel.css" />
    <!--!JavaScript-->
    <script src="../javascript/adminPanel.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-brand">
                <i class="bi bi-king-fill"></i>
                <span>MattAdmin</span>
            </a>
        </div>
        <!-- Navigation Links -->
        <div class="sidebar-menu">
            <div class="menu-category">Overview</div>
            <a href="#" class="nav-link active" onclick="showSection('dashboard')">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('analytics')">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Analytics</span>
            </a>

            <div class="menu-category">Management</div>
            <a href="#" class="nav-link" onclick="showSection('users')">
                <i class="bi bi-people-fill"></i>
                <span>Users</span>
                <span class="badge bg-primary ms-auto">2.4k</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('games')">
                <i class="bi bi-knight-fill"></i>
                <span>Games</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('chats')">
                <i class="bi bi-chat-dots-fill"></i>
                <span>Chat Moderation</span>
                <span class="badge bg-danger ms-auto">12</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('abilities')">
                <i class="bi bi-magic"></i>
                <span>Abilities</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('friends')">
                <i class="bi bi-heart-fill"></i>
                <span>Social Graph</span>
            </a>

            <div class="menu-category">Security</div>
            <a href="#" class="nav-link" onclick="showSection('security')">
                <i class="bi bi-shield-check"></i>
                <span>Login History</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('bans')">
                <i class="bi bi-ban"></i>
                <span>Banned Users</span>
                <span class="badge bg-warning text-dark ms-auto">5</span>
            </a>

            <div class="menu-category">System</div>
            <a href="#" class="nav-link" onclick="showSection('settings')">
                <i class="bi bi-gear-fill"></i>
                <span>Settings</span>
            </a>
            <a href="#" class="nav-link text-danger" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="toggle-sidebar" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search players, games...">
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-gold position-relative">
                    <i class="bi bi-bell-fill"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        3
                    </span>
                </button>
                <div class="user-profile dropdown">
                    <div data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=d4af37&color=000" alt="Admin"
                            class="user-avatar">
                        <div class="d-none d-md-block">
                            <div class="fw-bold text-white">Grandmaster Admin</div>
                            <small class="text-muted">ELO: 1500</small>
                        </div>
                        <i class="bi bi-chevron-down text-secondary ms-2"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary">
                        <li><a class="dropdown-item text-light" href="#"><i class="bi bi-person me-2"></i>Profile</a>
                        </li>
                        <li><a class="dropdown-item text-light" href="#"><i class="bi bi-gear me-2"></i>Settings</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider border-secondary">
                        </li>
                        <li><a class="dropdown-item text-danger" href="#"><i
                                    class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
