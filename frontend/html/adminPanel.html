<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' http://127.0.0.1:3000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/adminPanel.css" />
    <!--!JavaScript-->
    <script src="../javascript/adminPanel.js"></script>
</head>

<body>
    <!-- Sidebar -->
<nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-brand">
                <i class="bi bi-king-fill"></i>
                <span>MattAdmin</span>
            </a>
        </div>
    <!-- Navigation Links -->
        <div class="sidebar-menu">
            <div class="menu-category">Overview</div>
            <a href="#" class="nav-link active" onclick="showSection('dashboard')">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('analytics')">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Analytics</span>
            </a>

            <div class="menu-category">Management</div>
            <a href="#" class="nav-link" onclick="showSection('users')">
                <i class="bi bi-people-fill"></i>
                <span>Users</span>
                <span class="badge bg-primary ms-auto">2.4k</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('games')">
                <i class="bi bi-knight-fill"></i>
                <span>Games</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('chats')">
                <i class="bi bi-chat-dots-fill"></i>
                <span>Chat Moderation</span>
                <span class="badge bg-danger ms-auto">12</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('abilities')">
                <i class="bi bi-magic"></i>
                <span>Abilities</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('friends')">
                <i class="bi bi-heart-fill"></i>
                <span>Social Graph</span>
            </a>

            <div class="menu-category">Security</div>
            <a href="#" class="nav-link" onclick="showSection('security')">
                <i class="bi bi-shield-check"></i>
                <span>Login History</span>
            </a>
            <a href="#" class="nav-link" onclick="showSection('bans')">
                <i class="bi bi-ban"></i>
                <span>Banned Users</span>
                <span class="badge bg-warning text-dark ms-auto">5</span>
            </a>

            <div class="menu-category">System</div>
            <a href="#" class="nav-link" onclick="showSection('settings')">
                <i class="bi bi-gear-fill"></i>
                <span>Settings</span>
            </a>
            <a href="#" class="nav-link text-danger" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </nav>
    <!-- Main Content -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
