<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' http://127.0.0.1:3000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MattMester</title>
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <!--!CSS-->
    <link rel="stylesheet" href="../css/index.css" />
    <!--!JavaScript-->
    <script src="../javascript/index.js"></script>
</head>

<body>
    <!--?Navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass fixed-top">
        <div class="container">
            <a class="navbar-brand brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-king-fill"></i>
                <span>MATTMESTER</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <!--? Vendég menü + talán később élő óra funkció -->
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="guestActions">
                    <!-- <li class="nav-item me-lg-2">
                        <span class="live-chip"><span class="live-dot"></span><span id="liveClock">--:--:--</span></span>
                    </li> -->
                    <li class="nav-item">
                        <button class="btn btn-outline-gold btn-sm" data-bs-toggle="modal"
                            data-bs-target="#loginModal">Bejelentkezés</button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-gold btn-sm" data-bs-toggle="modal"
                            data-bs-target="#registerModal">Regisztráció</button>
                    </li>
                </ul>
                <!--? Bejelentkezett felhasználó menü -->
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="userActions">
                    <!-- <li class="nav-item me-lg-2">
                        <span class="live-chip"><span class="live-dot"></span><span id="liveClock">--:--:--</span></span>
                    </li> -->
                    <li class="nav-item">
                        <button class="btn btn-outline-gold btn-sm" onclick="location.href='/profile'">Profil
                            beállítás</button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-gold btn-sm" data-bs-toggle="modal"
                            onclick="logout()">Kijelentkezés</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</html>
