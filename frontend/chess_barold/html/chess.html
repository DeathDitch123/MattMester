<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattmester</title>
    <link rel="stylesheet" href="../css/chess.css">
    <script type="module" src="../javascript/main.js"></script>
</head>
<body>
    <!-- JÁTÉKMÓD VÁLASZTÓ MODAL -->
    <div id="mode-modal" class="mode-modal">
        <div class="mode-modal-content">
            <h2 class="mode-title">Mattmester</h2>
            <p class="mode-subtitle">Válassz játékmódot</p>

            <!-- 1. LÉPÉS: Mód választás -->
            <div id="mode-step1" class="mode-step">
                <button class="mode-btn" id="mode-bot">
                    <span class="mode-icon">🤖</span>
                    <span class="mode-label">Robot ellen</span>
                </button>
                <button class="mode-btn mode-btn-disabled" id="mode-pvp" disabled>
                    <span class="mode-icon">👥</span>
                    <span class="mode-label">Játékos ellen</span>
                    <span class="mode-soon">Hamarosan</span>
                </button>
            </div>

            <!-- 2. LÉPÉS: Nehézség választás -->
            <div id="mode-step2" class="mode-step hidden">
                <p class="mode-subtitle">Robot nehézség</p>
                <div id="difficulty-list" class="difficulty-list"></div>
                <button class="mode-back-btn" id="mode-back">← Vissza</button>
            </div>

            <!-- ELO kijelzés -->
            <div id="user-elo-display" class="user-elo-display">
                Az ELO-d: <strong id="user-elo-value">800</strong>
            </div>
        </div>
    </div>

    <div class="app">
        <header class="topbar">
            <div class="player player-black">
                <div class="name" id="name-black">Ellenfél</div>
                <div class="clock" id="clock-black">10:00</div>
            </div>
        </header>

        <main class="main">
            <div class="board-wrap">
                <div id="board" class="board" aria-label="Sakk tábla"></div>

                <div id="promotion-modal" class="promotion-modal hidden">
                    <div class="promotion-overlay"></div>
                    <div class="promotion-choices">
                        <div class="promotion-piece" data-type="queen"></div>
                        <div class="promotion-piece" data-type="rook"></div>
                        <div class="promotion-piece" data-type="bishop"></div>
                        <div class="promotion-piece" data-type="knight"></div>
                    </div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="status-row">
                    Aktív: <strong id="turn-name">fehér</strong>
                </div>
                <div id="status" class="status">játékon</div>

                <!-- ELO változás kijelzés -->
                <div id="elo-change" class="elo-change hidden"></div>

                <button id="resetBtn">Újra</button>
                <button id="newGameBtn" class="new-game-btn">Új játék</button>
                <div class="legend">
                    <div><span class="legend-sq from"></span> Utolsó lépés</div>
                    <div><span class="legend-sq capture"></span> Ütés lehetőség</div>
                    <div><span class="legend-sq check"></span> Király sakkban</div>
                    <div><span class="legend-sq enpassant"></span> En passant</div>
                    <div><span class="legend-sq castle"></span> Sáncolás</div>
                    <div><span class="legend-sq promotion"></span> Átváltozás</div>
                </div>
            </aside>
        </main>

        <footer class="bottombar">
            <div class="player player-white">
                <div class="name" id="name-white">Te</div>
                <div class="clock" id="clock-white">10:00</div>
            </div>
        </footer>
    </div>
</body>
</html>
