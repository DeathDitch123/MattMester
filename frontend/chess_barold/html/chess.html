<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattmester</title>
    <link rel="stylesheet" href="../css/chess.css">
    <!-- <script src="../javascript/chess.js" defer></script> -->
    <script type="module" src="../javascript/main.js"></script>
</head>
<body>
    <h1>Sakkjáték</h1>
    <div id="info">
        <div>
            <div>Fehér: <span id="clock-white">10:00</span></div>
        </div>
        <div>
            <div>Fekete: <span id="clock-black">10:00</span></div>
        </div>
        <button id="new-game-btn">Új játék</button>
    </div>

    <div id="board"></div>

    <!-- Gylogátváltozás modal -->
    <div id="promotion-modal" class="hidden">
        <div class="promotion-piece" data-type="queen"></div>
        <div class="promotion-piece" data-type="rook"></div>
        <div class="promotion-piece" data-type="bishop"></div>
        <div class="promotion-piece" data-type="knight"></div>
    </div>
</body>
</html>
